services:
  cwtw-admin:
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    build:
      context: .
      dockerfile: Dockerfile
    #volumes:
     # - ./node_modules:/app/node_modules
      # - .:/app
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge