version: '3.8'

services:
  infra-command-center:
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    # Add volume for temporary file processing if needed
    volumes:
      - /tmp/gis-uploads:/tmp/gis-uploads

networks:
  app-network:
    driver: bridge
